name: quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `permissions` does not accept expressions. Write is needed on main to push
# the quality-history branch; fork PRs get a read-only token regardless.
permissions:
  contents: write

env:
  PLAYWRIGHT_VERSION: "1.51.1"
  NODE_VERSION: "22"
  BUILD_TIME: ${{ github.run_started_at }}
  PIPELINE_START: ${{ github.run_started_at }}

jobs:
  quality:
    name: Quality pipeline
    runs-on: ubuntu-latest
    # `env` is not available here; keep in sync with PLAYWRIGHT_VERSION and
    # the pinned @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Fetch quality history
        run: |
          mkdir -p .quality
          if git fetch origin quality-history:quality-history 2>/dev/null; then
            git show quality-history:history.json > .quality/history.json
            echo "Loaded history from quality-history branch."
          else
            echo "No quality-history branch yet; starting with empty history."
          fi

      - name: Bootstrap current report
        run: node scripts/ci/bootstrap-current.mjs
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}

      - name: Install
        run: bash scripts/ci/stage.sh Install -- npm ci

      - name: Lint
        run: bash scripts/ci/stage.sh Lint -- npm run lint

      - name: Build A
        run: bash scripts/ci/stage.sh Build -- npm run build
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          QUALITY_REPORT: .quality/current.json

      # `vercel build` re-runs `astro build` into dist/, so keep a copy of
      # Build A for the equivalence check.
      - name: Snapshot Build A
        run: rm -rf dist-a && cp -R dist dist-a

      - name: Serve A
        run: |
          npx sirv dist --port 4321 --brotli --gzip --single > reports/serve-a.log 2>&1 &
          echo $! > reports/serve-a.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              echo "Serve A is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Serve A failed to start." >&2
          cat reports/serve-a.log || true
          exit 1

      - name: Playwright
        continue-on-error: true
        run: bash scripts/ci/stage.sh Playwright -- npm run test:e2e
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          CI: "true"
          # Firefox refuses to launch when $HOME isn't owned by the container user.
          HOME: /root
          QUALITY_REPORT: .quality/current.json
          REUSE_EXISTING_SERVER: "1"

      - name: axe
        continue-on-error: true
        run: bash scripts/ci/stage.sh axe -- npm run test:a11y
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT: reports/playwright-a11y.json
          HOME: /root
          QUALITY_REPORT: .quality/current.json
          REUSE_EXISTING_SERVER: "1"

      - name: Lighthouse
        continue-on-error: true
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          bash scripts/ci/stage.sh Lighthouse -- npx lhci collect --config=lighthouserc.cjs

      - name: Collect and validate report
        id: collect
        continue-on-error: true
        run: |
          node scripts/ci/collect-report.mjs
          node scripts/ci/validate-report.mjs
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          COMMIT_MESSAGE: >-
            ${{ github.event_name == 'schedule'
            && 'scheduled: weekly re-verification'
            || github.event.head_commit.message
            || 'CI quality run' }}

      - name: Stop Serve A
        if: always()
        run: |
          if [ -f reports/serve-a.pid ]; then
            kill "$(cat reports/serve-a.pid)" || true
          fi

      - name: Pull Vercel settings
        if: steps.collect.outputs.gate_status != 'fail'
        run: npx --yes vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

      - name: Build B
        if: steps.collect.outputs.gate_status != 'fail'
        run: |
          # Prebuilt output must match the deploy target (preview for PRs).
          PROD_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then PROD_FLAG="--prod"; fi
          bash scripts/ci/stage.sh Build -- npx --yes vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          DEPLOY_ENV: production
          QUALITY_REPORT: reports/quality-report.json
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Build B equivalence
        if: steps.collect.outputs.gate_status != 'fail'
        run: node scripts/ci/equivalence.mjs

      - name: Serve B
        if: steps.collect.outputs.gate_status != 'fail'
        run: |
          npx sirv .vercel/output/static --port 4322 --brotli --gzip --single > reports/serve-b.log 2>&1 &
          echo $! > reports/serve-b.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4322/ > /dev/null; then
              echo "Serve B is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Serve B failed to start." >&2
          cat reports/serve-b.log || true
          exit 1

      - name: axe on Build B
        if: steps.collect.outputs.gate_status != 'fail'
        run: npm run test:a11y
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:4322
          PLAYWRIGHT_JSON_OUTPUT: reports/playwright-a11y-b.json
          HOME: /root
          QUALITY_REPORT: reports/quality-report.json
          REUSE_EXISTING_SERVER: "1"

      - name: Playwright @quality smoke on Build B
        if: steps.collect.outputs.gate_status != 'fail'
        run: npx playwright test --project=chromium --grep @quality
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:4322
          PLAYWRIGHT_JSON_OUTPUT: reports/playwright-quality-b.json
          HOME: /root
          QUALITY_REPORT: reports/quality-report.json
          REUSE_EXISTING_SERVER: "1"

      - name: Stop Serve B
        if: always()
        run: |
          if [ -f reports/serve-b.pid ]; then
            kill "$(cat reports/serve-b.pid)" || true
          fi

      - name: Deploy
        if: >-
          steps.collect.outputs.gate_status != 'fail' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/ci/stage.sh Deploy -- npx --yes vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          else
            bash scripts/ci/stage.sh Deploy -- npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Configure git for history
        if: always() && github.event_name != 'pull_request'
        run: |
          # The container runs as a different user than the checkout owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record history
        if: always() && github.event_name != 'pull_request'
        run: node scripts/ci/record-history.mjs
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on blocking gates
        if: steps.collect.outputs.gate_status == 'fail'
        run: |
          echo "Blocking quality gates failed. Build B, verification, and deploy were skipped."
          exit 1
